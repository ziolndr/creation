<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06090C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E9E7E0" media="(prefers-color-scheme: light)">
<meta name="description" content="CREATION searches NCBI genome objects by biological meaning through ARBITER.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CREATION — genome field</title>
<script>
(() => {
  try {
    document.documentElement.dataset.theme =
      localStorage.getItem("creation-theme") || "dark";
  } catch {
    document.documentElement.dataset.theme = "dark";
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600;125,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;600&display=swap">
<style>
:root{
  color-scheme:dark;

  --void:#06090C;
  --plate:#0B1015;
  --plate-2:#0E141A;
  --rule:#1B242D;
  --rule-strong:#2B3742;
  --ink:#E7EEF3;
  --dim:#74889A;
  --faint:#4C5C6A;
  --gold:#E9B23C;
  --gold-ink:#06090C;
  --alarm:#FF6B76;
  --shade:rgba(6,9,12,.94);

  --ch-assembly:#E9B23C;
  --ch-sequence:#4FA3FF;
  --ch-gene:#3FD39A;
  --ch-transcript:#B98CF5;
  --ch-cds:#FF9457;
  --ch-protein:#FF6B8A;
  --ch-other:#7D91A1;

  --tap:46px;
  --pad:max(16px, env(safe-area-inset-left));
  --pad-r:max(16px, env(safe-area-inset-right));

  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --display:"Archivo","Archivo Expanded","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="light"]{
  color-scheme:light;

  --void:#E9E7E0;
  --plate:#F4F2EC;
  --plate-2:#EFEDE6;
  --rule:#CFCCC2;
  --rule-strong:#ADA99D;
  --ink:#0D1116;
  --dim:#5C6672;
  --faint:#8A9099;
  --gold:#8A6410;
  --gold-ink:#F4F2EC;
  --alarm:#A32330;
  --shade:rgba(233,231,224,.94);

  --ch-assembly:#8A6410;
  --ch-sequence:#1E5FBF;
  --ch-gene:#0F7A54;
  --ch-transcript:#6B3FB5;
  --ch-cds:#B24A11;
  --ch-protein:#B01F44;
  --ch-other:#5C6672;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  min-height:100dvh;
  background:var(--void);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  overflow-x:hidden;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── masthead + measure bar ─────────────────────────────── */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--shade);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top);
}
.masthead{
  height:52px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 var(--pad-r) 0 var(--pad);
}
.mark{
  display:inline-flex;
  align-items:baseline;
  gap:8px;
  text-decoration:none;
  color:inherit;
  margin-right:auto;
  min-width:0;
}
.mark-word{
  font-family:var(--display);
  font-variation-settings:"wdth" 125;
  font-weight:700;
  font-size:19px;
  line-height:1;
  letter-spacing:.015em;
}
.tally{
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.04em;
  color:var(--dim);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.theme-btn{
  width:var(--tap);
  height:var(--tap);
  display:grid;
  place-items:center;
  background:none;
  border:1px solid var(--rule);
  color:var(--dim);
  flex:0 0 auto;
}
.theme-btn:hover{border-color:var(--rule-strong);color:var(--ink)}
.theme-dot{
  width:11px;height:11px;border-radius:50%;
  border:1px solid currentColor;
  background:linear-gradient(90deg,currentColor 50%,transparent 50%);
}

.measure{
  display:flex;
  border-top:1px solid var(--rule);
  background:var(--plate);
}
.measure input{
  flex:1 1 auto;
  min-width:0;
  height:56px;
  border:0;
  background:none;
  padding:0 14px 0 var(--pad);
  font-size:16px;
  letter-spacing:-.01em;
}
.measure input::placeholder{color:var(--faint)}
.measure input:focus{outline:none;background:var(--plate-2)}
.measure button{
  flex:0 0 auto;
  height:56px;
  min-width:112px;
  padding:0 20px;
  padding-right:max(20px, env(safe-area-inset-right));
  border:0;
  border-left:1px solid var(--rule);
  background:var(--gold);
  color:var(--gold-ink);
  font-family:var(--mono);
  font-size:11px;
  font-weight:600;
  letter-spacing:.12em;
}
.measure button:active{filter:brightness(.9)}

/* ── channels ───────────────────────────────────────────── */
.channels{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  padding:10px var(--pad-r) 10px var(--pad);
  border-bottom:1px solid var(--rule);
  background:var(--void);
}
.channels::-webkit-scrollbar{display:none}
.chan{
  flex:0 0 auto;
  height:34px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:0 11px;
  border:1px solid var(--rule);
  background:none;
  color:var(--dim);
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.09em;
  white-space:nowrap;
}
.chan-dot{width:6px;height:6px;flex:0 0 auto;background:var(--c,var(--ch-other))}
.chan-n{font-variant-numeric:tabular-nums;color:var(--faint)}
.chan[aria-pressed="true"]{
  border-color:var(--c,var(--gold));
  color:var(--ink);
}
.chan[aria-pressed="true"] .chan-n{color:var(--c,var(--gold))}
.chan[disabled]{opacity:.35}

/* ── readout ────────────────────────────────────────────── */
.readout{
  border-bottom:1px solid var(--rule);
  background:var(--plate);
}
.line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:11px var(--pad-r) 11px var(--pad);
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.09em;
  color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.line b{font-weight:500;color:var(--ink)}
.readout.fault .line{color:var(--alarm)}
.readout.fault .line b{color:var(--alarm)}

/* signature: the field trace */
.trace{
  display:flex;
  align-items:flex-end;
  gap:1px;
  height:54px;
  padding:0 var(--pad-r) 0 var(--pad);
  border-top:1px solid var(--rule);
  background:
    repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 40px);
  background-position:var(--pad) 0;
  overflow:hidden;
}
.trace[hidden]{display:none}
.tick{
  flex:1 1 0;
  min-width:2px;
  padding:0;
  border:0;
  border-radius:0;
  background:var(--c,var(--ch-other));
  opacity:.62;
  transform-origin:bottom;
  animation:rise .42s cubic-bezier(.2,.9,.3,1) backwards;
}
.tick:hover,.tick.lit{opacity:1}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.scan{height:2px;background:var(--rule)}
.scan[hidden]{display:none}
.scan::after{
  content:"";
  display:block;
  height:100%;
  width:26%;
  background:var(--gold);
  animation:sweep .9s linear infinite;
}
@keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(460%)}}

/* ── records ────────────────────────────────────────────── */
.record{
  display:block;
  border-bottom:1px solid var(--rule);
  padding:18px var(--pad-r) 20px var(--pad);
  scroll-margin-top:190px;
}
.record.lit{background:var(--plate-2)}
.stamp{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.1em;
  color:var(--c,var(--ch-other));
  font-variant-numeric:tabular-nums;
}
.stamp .rank{color:var(--faint)}
.stamp .org{
  color:var(--dim);
  letter-spacing:.02em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.name{
  font-size:20px;
  line-height:1.2;
  letter-spacing:-.02em;
  font-weight:450;
  margin:9px 0 0;
  overflow-wrap:anywhere;
}
.gist{
  margin:8px 0 0;
  font-size:14px;
  line-height:1.55;
  color:var(--dim);
  overflow-wrap:anywhere;
  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.resonance{
  display:flex;
  align-items:baseline;
  gap:9px;
  margin-top:14px;
  font-family:var(--mono);
  font-variant-numeric:tabular-nums;
}
.resonance .v{font-size:19px;font-weight:500;letter-spacing:-.01em}
.resonance .l{font-size:9px;letter-spacing:.14em;color:var(--faint)}
.gauge{height:2px;margin-top:7px;background:var(--rule)}
.gauge i{display:block;height:100%;background:var(--c,var(--gold))}
.ids{
  margin-top:12px;
  font-family:var(--mono);
  font-size:10px;
  line-height:1.7;
  color:var(--faint);
  letter-spacing:.03em;
  overflow-wrap:anywhere;
}
.ids b{color:var(--dim);font-weight:400}
.acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.act{
  height:38px;
  display:inline-flex;
  align-items:center;
  padding:0 12px;
  border:1px solid var(--rule);
  background:none;
  color:var(--dim);
  text-decoration:none;
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.09em;
}
.act:hover{border-color:var(--rule-strong);color:var(--ink)}
.act.primary{border-color:var(--rule-strong);color:var(--ink)}

/* ── prompts + states ───────────────────────────────────── */
.void{
  padding:44px var(--pad-r) 44px var(--pad);
  color:var(--dim);
  font-size:15px;
  line-height:1.6;
  max-width:52ch;
}
.void b{display:block;color:var(--ink);font-weight:450;margin-bottom:6px}
.void.fault b{color:var(--alarm)}

.starters{border-top:1px solid var(--rule);padding:22px var(--pad-r) 34px var(--pad)}
.starters h2{
  margin:0 0 12px;
  font-family:var(--mono);
  font-size:10px;
  font-weight:500;
  letter-spacing:.14em;
  color:var(--faint);
}
.starter{
  display:block;
  width:100%;
  text-align:left;
  border:0;
  border-top:1px solid var(--rule);
  background:none;
  color:var(--dim);
  padding:14px 0;
  font-size:14px;
  line-height:1.4;
}
.starter:first-of-type{border-top:0}
.starter:hover{color:var(--ink)}
.starter::before{content:"→ ";color:var(--gold)}

.colophon{
  border-top:1px solid var(--rule);
  padding:20px var(--pad-r) 34px var(--pad);
  font-family:var(--mono);
  font-size:10px;
  line-height:1.9;
  letter-spacing:.06em;
  color:var(--faint);
}

/* ── desktop ────────────────────────────────────────────── */
@media (min-width:900px){
  :root{--pad:32px;--pad-r:32px}
  .masthead{height:60px}
  .mark-word{font-size:22px}
  .measure input{height:60px;font-size:17px}
  .measure button{height:60px;padding:0 26px}
  .trace{height:76px}
  .frame{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .rail{
    position:sticky;
    top:170px;
    border-left:1px solid var(--rule);
    align-self:stretch;
  }
  .starters{border-top:0}
  .record{padding:22px 32px 24px;scroll-margin-top:200px}
  .name{font-size:23px;max-width:60ch}
  .gist{font-size:14.5px;max-width:74ch}
  .record .resonance{margin-top:16px}
  .gauge{max-width:420px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .scan::after{width:100%}
}
</style>
</head>
<body>

<div class="top">
  <div class="masthead">
    <a class="mark" href="#" aria-label="CREATION">
      <span class="mark-word">CREATION</span>
    </a>
    <span class="tally" id="tally">FIELD LOADING</span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch to light theme" aria-pressed="false">
      <span class="theme-dot" aria-hidden="true"></span>
    </button>
  </div>

  <form class="measure" id="form" role="search">
    <input
      id="q"
      type="search"
      inputmode="search"
      enterkeyhint="search"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Describe the biology"
      aria-label="Describe the biology you want to find"
      value="genes involved in DNA double-strand break repair"
    >
    <button type="submit">RESOLVE</button>
  </form>
</div>

<nav class="channels" id="channels" aria-label="Filter by object class"></nav>

<div class="readout" id="readout">
  <div class="line">
    <span id="state">CONNECTING</span>
    <span id="clock"></span>
  </div>
  <div class="trace" id="trace" role="img" aria-label="Resonance trace across returned objects" hidden></div>
  <div class="scan" id="scan" hidden></div>
</div>

<div class="frame">
  <main id="list"></main>

  <aside class="rail">
    <section class="starters">
      <h2>QUERIES TO TRY</h2>
      <button class="starter" type="button">proteins connecting DNA repair and chromatin remodeling</button>
      <button class="starter" type="button">mitochondrial sequences involved in oxidative phosphorylation</button>
      <button class="starter" type="button">bacterial proteins associated with antibiotic resistance</button>
      <button class="starter" type="button">developmental transcription factors conserved across animals</button>
      <button class="starter" type="button">genes regulating programmed cell death</button>
    </section>
    <div class="colophon">
      NCBI GENOME OBJECTS<br>
      ASSEMBLY · SEQUENCE · GENE · TRANSCRIPT · CDS · PROTEIN<br>
      MEASURED BY ARBITER — 26MB, 72D, DETERMINISTIC<br>
      RANKING ONLY. NO GENERATED TEXT.
    </div>
  </aside>
</div>

<script>
const MANIFEST_URL = "/field/v1/manifest";
const SEARCH_URL = "/field/v1/search";

const CHANNELS = [
  { key:"",           label:"ALL",         color:"var(--gold)" },
  { key:"assembly",   label:"ASSEMBLY",    color:"var(--ch-assembly)" },
  { key:"sequence",   label:"SEQUENCE",    color:"var(--ch-sequence)" },
  { key:"gene",       label:"GENE",        color:"var(--ch-gene)" },
  { key:"transcript", label:"TRANSCRIPT",  color:"var(--ch-transcript)" },
  { key:"cds",        label:"CDS",         color:"var(--ch-cds)" },
  { key:"protein",    label:"PROTEIN",     color:"var(--ch-protein)" },
  { key:"other",      label:"OTHER",       color:"var(--ch-other)" }
];

const el = id => document.getElementById(id);
const qInput = el("q");
const list = el("list");
const state = el("state");
const clock = el("clock");
const tally = el("tally");
const scan = el("scan");
const trace = el("trace");
const readout = el("readout");
const channelBar = el("channels");
const themeBtn = el("themeBtn");

let activeChannel = "";
let rows = [];
let elapsedMs = 0;
let debounce = null;
let controller = null;

/* ── theme ──────────────────────────────────────────────── */
const syncTheme = () => {
  const light = document.documentElement.dataset.theme === "light";
  themeBtn.setAttribute("aria-pressed", light ? "true" : "false");
  themeBtn.setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
};
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("creation-theme", next); } catch {}
  syncTheme();
});
syncTheme();

/* ── helpers (field contract preserved) ─────────────────── */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
})[c]);

const has = v => v !== undefined && v !== null && String(v).trim() !== "";
const first = (...vals) => { for (const v of vals) if (has(v)) return v; return ""; };

const channelOf = row => {
  const m = row?.metadata || {};
  const tag = String(first(row?.type, row?.kind, row?.category, m.type, m.kind, m.category, "")).toLowerCase();

  if (tag.includes("assembl")) return "assembly";
  if (tag.includes("gene")) return "gene";
  if (tag.includes("transcript") || tag.includes("rna")) return "transcript";
  if (tag.includes("protein") || tag.includes("peptide")) return "protein";
  if (tag === "cds" || tag.includes("coding sequence")) return "cds";
  if (tag.includes("sequence") || tag.includes("nucleotide") || tag.includes("chromosome")) return "sequence";

  const acc = accessionOf(row);
  if (/^GC[AF]_\d+(?:\.\d+)?$/i.test(acc)) return "assembly";
  if (/^(NP|XP|YP|WP|AP|P)_/i.test(acc)) return "protein";
  if (/^(NM|NR|XM|XR)_/i.test(acc)) return "transcript";
  if (/^(NC|NG|NT|NW|NZ|CP|CM)_/i.test(acc)) return "sequence";
  if (m.gene_id || m.gene_symbol || m.symbol) return "gene";

  return "other";
};

function accessionOf(row){
  const m = row?.metadata || {};
  return String(first(
    m.assembly_accession, m.accession, m.accession_version,
    m.protein_accession, m.transcript_accession, m.sequence_accession,
    row?.source_id, ""
  )).trim();
}

const ncbiURL = row => {
  const m = row?.metadata || {};
  const direct = first(row?.external_url, row?.url, m.external_url, m.ncbi_url, m.source_url, "");

  if (direct) {
    try {
      const u = new URL(String(direct));
      if (u.protocol === "https:" && /(^|\.)ncbi\.nlm\.nih\.gov$/i.test(u.hostname)) return u.href;
    } catch {}
  }

  const ch = channelOf(row);
  const acc = accessionOf(row);
  const gid = String(first(m.gene_id, m.geneid, m.entrez_gene_id, m.entrez_id, "")).trim();

  if (gid && /^\d+$/.test(gid)) return `https://www.ncbi.nlm.nih.gov/gene/${encodeURIComponent(gid)}`;
  if (/^GC[AF]_\d+(?:\.\d+)?$/i.test(acc)) return `https://www.ncbi.nlm.nih.gov/datasets/genome/${encodeURIComponent(acc)}/`;
  if (ch === "protein" && acc) return `https://www.ncbi.nlm.nih.gov/protein/${encodeURIComponent(acc)}`;
  if (["transcript","sequence","cds"].includes(ch) && acc) return `https://www.ncbi.nlm.nih.gov/nuccore/${encodeURIComponent(acc)}`;

  const term = first(row?.title, acc, row?.source_id, "genome");
  return `https://www.ncbi.nlm.nih.gov/search/all/?term=${encodeURIComponent(term)}`;
};

const resonanceOf = row => Number(row?.resonance ?? row?.score ?? row?.similarity);
const colorFor = key => CHANNELS.find(c => c.key === key)?.color || "var(--ch-other)";

/* ── channel bar ────────────────────────────────────────── */
channelBar.innerHTML = CHANNELS.map(c => `
  <button class="chan" type="button" data-key="${c.key}" style="--c:${c.color}"
          aria-pressed="${c.key === "" ? "true" : "false"}">
    <span class="chan-dot" aria-hidden="true"></span>
    <span>${c.label}</span>
    <span class="chan-n">0</span>
  </button>
`).join("");

const chanButtons = [...channelBar.querySelectorAll(".chan")];

chanButtons.forEach(btn => btn.addEventListener("click", () => {
  activeChannel = btn.dataset.key;
  render();
  btn.scrollIntoView({ block:"nearest", inline:"center", behavior:"smooth" });
}));

const tallyChannels = () => {
  const counts = { "":rows.length };
  for (const row of rows) {
    const k = channelOf(row);
    counts[k] = (counts[k] || 0) + 1;
  }
  for (const btn of chanButtons) {
    const k = btn.dataset.key;
    const n = counts[k] || 0;
    btn.querySelector(".chan-n").textContent = n.toLocaleString();
    btn.setAttribute("aria-pressed", k === activeChannel ? "true" : "false");
    btn.disabled = k !== "" && n === 0;
    btn.setAttribute("aria-label", `${btn.textContent.trim().replace(/\s+/g," ")} — ${n} objects`);
  }
};

/* ── trace ──────────────────────────────────────────────── */
const paintTrace = shown => {
  if (!shown.length) { trace.hidden = true; trace.innerHTML = ""; return; }

  const vals = shown.map(resonanceOf).filter(Number.isFinite);
  const hi = vals.length ? Math.max(...vals) : 1;
  const lo = vals.length ? Math.min(...vals) : 0;
  const span = hi - lo || 1;

  trace.hidden = false;
  trace.innerHTML = shown.map((row, i) => {
    const v = resonanceOf(row);
    const h = Number.isFinite(v) ? 16 + ((v - lo) / span) * 84 : 16;
    const ch = channelOf(row);
    return `<button class="tick" type="button" tabindex="-1" aria-hidden="true" data-i="${i}"
      style="height:${h.toFixed(1)}%;--c:${colorFor(ch)};animation-delay:${Math.min(i*8,420)}ms"></button>`;
  }).join("");

  trace.querySelectorAll(".tick").forEach(tick => {
    tick.addEventListener("click", () => {
      const card = document.getElementById(`r${tick.dataset.i}`);
      if (!card) return;
      card.scrollIntoView({ behavior:"smooth", block:"center" });
      document.querySelectorAll(".record.lit").forEach(n => n.classList.remove("lit"));
      card.classList.add("lit");
      trace.querySelectorAll(".tick.lit").forEach(n => n.classList.remove("lit"));
      tick.classList.add("lit");
    });
  });
};

/* ── render ─────────────────────────────────────────────── */
const render = () => {
  const shown = activeChannel ? rows.filter(r => channelOf(r) === activeChannel) : rows;

  tallyChannels();
  readout.classList.remove("fault");

  state.innerHTML = `<b>${shown.length.toLocaleString()}</b> OBJECTS · ${activeChannel ? activeChannel.toUpperCase() : "ALL CHANNELS"}`;
  clock.textContent = elapsedMs ? `${Math.round(elapsedMs)} MS` : "";

  paintTrace(shown);

  if (!shown.length) {
    list.innerHTML = `<div class="void"><b>Nothing resolved for that.</b>
      Widen the phrasing, drop a constraint, or switch back to all channels.</div>`;
    return;
  }

  const hi = Math.max(...shown.map(resonanceOf).filter(Number.isFinite), 0) || 1;

  list.innerHTML = shown.map((row, i) => {
    const m = row.metadata || {};
    const ch = channelOf(row);
    const acc = accessionOf(row);
    const v = resonanceOf(row);
    const vText = Number.isFinite(v) ? v.toFixed(4) : "—";
    const width = Number.isFinite(v) ? Math.max(2, (v / hi) * 100) : 0;
    const rank = String(Number(row.rank || i + 1)).padStart(2, "0");
    const organism = first(m.organism, m.organism_name, "");
    const assembly = first(m.assembly_accession, "");
    const taxon = first(m.tax_id, m.taxid, "");

    return `
      <article class="record" id="r${i}" style="--c:${colorFor(ch)}">
        <div class="stamp">
          <span class="rank">${rank}</span>
          <span>${esc(ch.toUpperCase())}</span>
          ${organism ? `<span class="org">· ${esc(organism)}</span>` : ""}
        </div>

        <h3 class="name">${esc(first(row.title, row.name, row.label, acc, "Untitled object"))}</h3>
        ${has(first(row.overview, row.description, row.summary, ""))
          ? `<p class="gist">${esc(first(row.overview, row.description, row.summary, ""))}</p>` : ""}

        <div class="resonance">
          <span class="v">${vText}</span>
          <span class="l">RESONANCE</span>
        </div>
        <div class="gauge"><i style="width:${width.toFixed(1)}%"></i></div>

        <div class="ids">
          ${acc ? `<b>ACCESSION</b> ${esc(acc)}<br>` : ""}
          ${assembly ? `<b>ASSEMBLY</b> ${esc(assembly)}<br>` : ""}
          ${taxon ? `<b>TAXON</b> ${esc(taxon)}` : ""}
        </div>

        <div class="acts">
          <a class="act primary" href="${esc(ncbiURL(row))}" target="_blank" rel="noopener noreferrer">OPEN IN NCBI ↗</a>
          ${acc ? `<button class="act" type="button" data-copy="${esc(acc)}">COPY ACCESSION</button>` : ""}
        </div>
      </article>
    `;
  }).join("");

  list.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const value = btn.dataset.copy;
      try {
        await navigator.clipboard.writeText(value);
        btn.textContent = `COPIED ${value}`;
      } catch {
        btn.textContent = "COPY BLOCKED — SELECT MANUALLY";
      }
      setTimeout(() => { btn.textContent = "COPY ACCESSION"; }, 1800);
    });
  });
};

const fault = message => {
  rows = [];
  elapsedMs = 0;
  tallyChannels();
  trace.hidden = true;
  readout.classList.add("fault");
  state.textContent = "FIELD UNREACHABLE";
  clock.textContent = "";
  list.innerHTML = `<div class="void fault"><b>${esc(message)}</b>
    The field did not answer. Measure again, or check that the ARBITER service is up.</div>`;
};

/* ── field calls ────────────────────────────────────────── */
async function manifest(){
  const res = await fetch(MANIFEST_URL, { cache:"no-store" });
  if (!res.ok) throw new Error(`Manifest returned HTTP ${res.status}`);

  const data = await res.json();
  const objects = Number(first(data.count, data.live_count, data.indexed_count, 0));
  const assemblies = Number(first(data.assemblies, data.assembly_count, 0));
  const dims = Number(first(data.dimensions, data.dimension, data.dim, 72));

  tally.textContent = assemblies
    ? `${objects.toLocaleString()} OBJ · ${assemblies.toLocaleString()} ASM`
    : `${objects.toLocaleString()} OBJ · ${dims}D`;
}

async function search(){
  const text = qInput.value.trim();
  if (!text) return;

  if (controller) controller.abort();
  controller = new AbortController();

  readout.classList.remove("fault");
  state.textContent = "RESOLVING";
  clock.textContent = "";
  scan.hidden = false;

  try {
    const res = await fetch(SEARCH_URL, {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body: JSON.stringify({ text, q:text, k:100, types:[] }),
      signal: controller.signal
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Search returned HTTP ${res.status}`);

    rows = Array.isArray(data.results) ? data.results
         : Array.isArray(data.matches) ? data.matches
         : Array.isArray(data.items) ? data.items
         : [];

    elapsedMs = Number(data.elapsed_ms || data.elapsed || 0);
    render();
  } catch (err) {
    if (err?.name === "AbortError") return;
    fault(err?.message || "Search failed");
  } finally {
    scan.hidden = true;
  }
}

/* ── wiring ─────────────────────────────────────────────── */
el("form").addEventListener("submit", e => {
  e.preventDefault();
  qInput.blur();
  search();
});

qInput.addEventListener("input", () => {
  clearTimeout(debounce);
  debounce = setTimeout(search, 420);
});

qInput.addEventListener("focus", () => qInput.select(), { once:true });

document.querySelectorAll(".starter").forEach(btn => {
  btn.addEventListener("click", () => {
    qInput.value = btn.textContent.trim();
    activeChannel = "";
    search();
    window.scrollTo({ top:0, behavior:"smooth" });
  });
});

manifest().catch(() => { tally.textContent = "FIELD OFFLINE"; });
search();
</script>
</body>
</html>
